
  server:
    port: 8080

  spring:
    datasource:
      url: jdbc:mysql://localhost:3306/chatbotdb
      username: root
      password: Ak@akash
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect

    data:
      redis:
        host: localhost
        port: 6379

    cache:
      redis:
        time-to-live: 600000

    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:your-email@gmail.com}
      password: ${MAIL_PASSWORD:your-app-password}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

  jwt:
    secret: ${JWT_SECRET:AkashSpringBootJwtSecretKey256BitsSecure2026ForHS256}
    expiration: ${JWT_EXPIRATION:3600000}

